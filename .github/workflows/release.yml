name: Release

# Push a tag like v1.2.3 (via `npm version`) and this builds the Mac app and attaches the DMG to the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14 # Apple Silicon (arm64): the DMG is arm64 only
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # never look for a signing certificate; the app is ad-hoc signed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
      - run: npm ci
      - run: npm --prefix desktop ci
      # Electron has no postinstall: fetch its binary now (the staging step runs it).
      - run: node desktop/node_modules/electron/install.js
      - run: npm run desktop:dist
      - name: Check the DMG matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="desktop/out/Placed-${version}-arm64.dmg"
          ls -l desktop/out
          if [ ! -f "$dmg" ]; then
            echo "::error::Expected $dmg for tag $GITHUB_REF_NAME. Did you tag without running 'npm version'?"
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/out/*.dmg
            desktop/out/*.dmg.blockmap
          generate_release_notes: true
