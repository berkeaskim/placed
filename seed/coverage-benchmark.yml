# Recall benchmark: well-known UK early-careers employers (internships, placements, spring weeks, vacation schemes).
# Hand-curated 2026-10-14 by sector from the employers UK students target most (Times Top 100 / bulge-bracket /
# Magic Circle / MBB / Big 4 / FMCG grad schemes / big tech). It is a yardstick, not a seed list:
# `sources` lists the seed/companies.yml boards ("ats:slug") that carry this employer's student roles; an employer
# counts as covered when at least one of them is enabled. List old and new boards, so a before/after compare works.
# `ats` is where the student roles actually live; `why` explains a gap or a non-obvious source.
# ATS findings come from probing public board APIs and the employer's careers page (2026-10-14).
# Coverage: `npm run coverage` (offline) or `npm run coverage -- --live` (fetches every board, no DB writes).

