  location: Across the UK
  opens: 2026-10
  season: 2027
  kind: spring-week
  description: A paid three-day taster at a PwC office in spring 2027 for first-year undergraduates (second year on a four-year degree) from groups under-represented at PwC. PwC runs it as three strands - Advancing Social Mobility, Black Talent in Business and Women in Business - and you apply to the one you are eligible for. You meet PwC teams, get mentoring and work on business skills.
